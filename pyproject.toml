[project]
name = "markweave-mcp"
version = "0.1.0"
description = "MCP server exposing an Obsidian vault and its Graphify graph"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.7",
]

[project.scripts]
markweave-mcp = "markweave_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markweave_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
